<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav [mode]="isMobile() ? 'over' : 'side'" [opened]="!isMobile()" class="app-sidenav">
    <div class="sidenav-header">
      <mat-icon color="primary" class="logo-icon">layers</mat-icon>
      <span class="app-title">Request Portal</span>
    </div>
    
    <mat-nav-list>
      <a mat-list-item routerLink="/requests" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}" (click)="isMobile() ? sidenav.close() : null">
        <mat-icon matListItemIcon>list_alt</mat-icon>
        <span matListItemTitle>All Requests</span>
      </a>
      <a mat-list-item routerLink="/requests/new" routerLinkActive="active-link" (click)="isMobile() ? sidenav.close() : null">
        <mat-icon matListItemIcon>add_circle_outline</mat-icon>
        <span matListItemTitle>New Request</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <mat-toolbar color="primary" class="app-toolbar mat-elevation-z2">
      <button mat-icon-button (click)="sidenav.toggle()" class="menu-button">
        <mat-icon>menu</mat-icon>
      </button>
      <span>Internal Requests Management</span>
      <span class="spacer"></span>
      <button mat-button class="user-button">
        <mat-icon>account_circle</mat-icon>
        <span>Admin User</span>
      </button>
    </mat-toolbar>

    <main class="main-container">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
